# Optional: push this folder to a GitHub repo and this builds ghcr.io/<you>/spawnpoint:latest on every push.
# Then set the Unraid template's Repository to that image so Unraid can show and apply updates.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spawnpoint" >> "$GITHUB_OUTPUT"
      # Two architectures: 64-bit Intel/AMD and 64-bit ARM (Raspberry Pi 4/5, Ampere, Apple Silicon VMs).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.name.outputs.image }}:latest
